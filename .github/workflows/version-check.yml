name: Version Check

# 守门：manifest / package.json / versions.json 三处版本号一致，
# 且 manifest 的 id / name / description 符合社区商店红线。
# 不装依赖，跑得很快。

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check version consistency
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node .github/scripts/check-version.mjs --tag "${GITHUB_REF_NAME}"
          else
            node .github/scripts/check-version.mjs
          fi
